name: Database

# The JS checks cannot see a broken migration: a SQL file that does not parse,
# or that references a type that no longer exists, still produces a green build
# and a green test run. That gap shipped a coverage migration whose enum value
# had been removed from the schema months earlier — it was caught by hand when
# the deploy was attempted, not by CI.
#
# This workflow applies every migration to an empty database, which is the
# check that would have caught it.

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/database.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/database.yml'

jobs:
  clean-apply:
    name: Apply every migration to an empty database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not latest. The type check compares generated output byte
          # for byte, and a new generator reformats it — an unpinned CLI turns
          # somebody else's release into a red build on an unrelated change.
          version: 2.109.1

      - name: Start the local stack
        run: supabase start

      # `db reset` drops and rebuilds from the migration files, so it fails on
      # a file that does not parse, contradicts an earlier one, or trips its
      # own verification block. Every migration here is expected to be
      # self-checking rather than merely syntactically valid.
      - name: Rebuild the schema from the migration files
        run: supabase db reset

      # database.types.ts is generated, and there is no database on a developer
      # machine to regenerate it against, so it has been extended by hand more
      # than once. Hand-written types drift from the schema silently and the
      # compiler cannot tell: it believes whatever the file says.
      - name: Check the committed types match the schema
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          # Blank lines ignored on both sides: how many newlines land at the
          # end of a file survives a checkout and an artifact round trip
          # differently, and no real drift in generated types is ever only
          # whitespace at EOF.
          if ! diff -u -B src/lib/types/database.types.ts /tmp/database.types.ts; then
            echo "::error::src/lib/types/database.types.ts is out of date. Download the generated-types artifact from this run and commit it."
            exit 1
          fi

      - name: Publish the generated types
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-types
          path: /tmp/database.types.ts
          if-no-files-found: ignore

      - name: List what was applied
        if: always()
        run: supabase migration list --local

      - name: Collect logs on failure
        if: failure()
        run: supabase logs db || true

  upgrade-apply:
    name: Apply new migrations over the 1.1.0 schema
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not latest. The type check compares generated output byte
          # for byte, and a new generator reformats it — an unpinned CLI turns
          # somebody else's release into a red build on an unrelated change.
          version: 2.109.1

      # Resolved rather than pinned: a hard-coded tag quietly starts testing an
      # upgrade nobody performs any more, while still reporting green.
      - name: Roll the migration directory back to the last release
        run: |
          RELEASE=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          test -n "$RELEASE" || { echo "no release tag found"; exit 1; }
          echo "Upgrading from $RELEASE"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          rm -rf supabase/migrations
          git checkout "$RELEASE" -- supabase/migrations

      - name: Start the stack on the released schema
        run: supabase start

      - name: Seed rows the released schema allowed
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f .github/database/legacy-seed.sql

      # Two migrations add a unique index over data that was not unique before
      # them and do not clean up first, so an upgrade of any database that is
      # not production stops there. The requirement is documented and executed
      # here rather than hidden, because fixing it properly means editing
      # migrations that are already applied.
      - name: Run the documented preflight cleanup
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f .github/database/upgrade-preflight.sql

      - name: Restore the current migrations
        run: |
          rm -rf supabase/migrations
          git checkout HEAD -- supabase/migrations

      - name: Apply everything newer
        run: supabase migration up --local

      - name: List what was applied
        if: always()
        run: supabase migration list --local

      - name: Collect logs on failure
        if: failure()
        run: supabase logs db || true
