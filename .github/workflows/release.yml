name: Release to Vercel

# Publishing a GitHub Release is the one thing that ships production. Pushing
# a tag no longer does: a tag is bookkeeping, a release is a decision, and the
# two used to be the same gesture.
on:
  release:
    types: [published]

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: prj_86TL7O8C18wnyLgBObplfVgvxvRU

    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The event filter no longer carries the version pattern, so the shape of
      # the tag is checked here instead. A release cut from a draft branch, or
      # named anything other than vX.Y.Z, is not a production release.
      - name: Refuse a release that is not a version tag on main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$TAG is not a vX.Y.Z release tag"
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that is not on main"
            exit 1
          fi

      - name: Deploy with Vercel production environment
        run: npx vercel@53.3.1 deploy --yes --prod --token=${{ secrets.VERCEL_TOKEN }}
