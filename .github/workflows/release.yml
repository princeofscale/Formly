name: Release to Vercel

# Publishing a GitHub Release is the one thing that ships production. Pushing
# a tag no longer does: a tag is bookkeeping, a release is a decision, and the
# two used to be the same gesture.
on:
  release:
    types: [published]

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: prj_86TL7O8C18wnyLgBObplfVgvxvRU

    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The event filter no longer carries the version pattern, so the shape of
      # the tag is checked here instead. A release cut from a draft branch, or
      # named anything other than vX.Y.Z, is not a production release.
      - name: Refuse a release that is not a version tag on main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$TAG is not a vX.Y.Z release tag"
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that is not on main"
            exit 1
          fi

      - name: Deploy with Vercel production environment
        id: deploy
        run: |
          set -o pipefail
          # Logged through tee so a failing deploy still fails on its own error
          # rather than on the URL being missing afterwards.
          npx vercel@53.3.1 deploy --yes --prod --token=${{ secrets.VERCEL_TOKEN }} \
            | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -Eo 'https://[^[:space:]]+' "$RUNNER_TEMP/deploy.log" | tail -n1 || true)
          if [ -z "$url" ]; then
            echo "::error::the deploy printed no URL to smoke-check"
            exit 1
          fi
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"

      # Vercel calls a deployment ready when the build finishes. Nothing up to
      # here has asked the running app for an actual page, so a release that
      # builds and then 500s on every request looked exactly like a good one.
      #
      # This checks the deployment URL rather than the domain: it is the build
      # just published, with no alias or cache in between. It cannot roll back —
      # a red job is the signal, and the previous deployment stays one promote
      # away in the Vercel dashboard.
      - name: Smoke-check the deployment
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -o pipefail
          failed=0
          # Three fields: the path, where it must end up, and a marker only that
          # page renders. The landing check is the one that matters — middleware
          # sends any unknown path to /login with a 200, so "200 and the word
          # Formly" passes even for a page that no longer exists.
          #
          # Markers are class names rather than visible copy: the pages are
          # translated, and a smoke test must not fail over a locale.
          for spec in \
            "/|/login|Formly" \
            "/login|/login|Formly" \
            "/privacy|/privacy|legal-body" \
            "/terms|/terms|legal-body"; do
            IFS='|' read -r path expected marker <<<"$spec"
            read -r code landed < <(curl -sS -L --max-time 30 --retry 3 --retry-delay 5 \
              -o "$RUNNER_TEMP/page.html" -w '%{http_code} %{url_effective}' "$URL$path"; echo)
            if [ "$code" != "200" ]; then
              echo "::error::$path answered $code"
              failed=1
            elif [ "$landed" != "$URL$expected" ]; then
              echo "::error::$path landed on $landed, expected $URL$expected"
              failed=1
            elif ! grep -q "$marker" "$RUNNER_TEMP/page.html"; then
              echo "::error::$path rendered without $marker"
              failed=1
            else
              echo "$path OK"
            fi
          done
          exit "$failed"
